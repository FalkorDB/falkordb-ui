<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FalkorDB Canvas 3D parity example</title>
    <style>
      body { font: 15px system-ui, sans-serif; margin: 0; color: #172033; }
      header { padding: 12px 16px; background: #172033; color: white; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: calc(100vh - 50px); }
      falkordb-canvas { display: block; min-width: 0; min-height: 0; }
      aside { overflow: auto; padding: 12px; border-left: 1px solid #d5dbe5; }
      button { display: block; width: 100%; margin: 0 0 8px; padding: 8px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 700px) {
        main { grid-template-columns: 1fr; grid-template-rows: 60vh 1fr; }
        aside { border-left: 0; border-top: 1px solid #d5dbe5; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
          "force-graph": "https://cdn.jsdelivr.net/npm/force-graph@1.51.0/+esm",
          "3d-force-graph": "https://esm.sh/3d-force-graph@1.80.1?external=three",
          "three": "https://esm.sh/three@0.186.1",
          "three/webgpu": "https://esm.sh/three@0.186.1/webgpu",
          "three/tsl": "https://esm.sh/three@0.186.1/tsl",
          "three/addons/": "https://esm.sh/three@0.186.1/examples/jsm/",
          "three/examples/": "https://esm.sh/three@0.186.1/examples/"
        }
      }
    </script>
  </head>
  <body>
    <header>FalkorDB Canvas — 3D API and shared-resource lifecycle</header>
    <main>
      <falkordb-canvas id="canvas"></falkordb-canvas>
      <aside>
        <button id="to-3d">Show 3D</button>
        <button id="to-2d">Show 2D</button>
        <button id="save-camera">Save camera</button>
        <button id="restore-camera">Restore camera</button>
        <button id="custom-links">Toggle custom link visual</button>
        <button id="culling">Read 3D culling diagnostics</button>
        <pre id="output">Loading Canvas…</pre>
      </aside>
    </main>
    <script type="module">
      import * as THREE from "three";
      import "../dist/index.js";

      const canvas = document.querySelector("#canvas");
      const output = document.querySelector("#output");
      let geometry;
      let savedCamera;
      let customLinksEnabled = false;

      const replaceSharedGeometry = () => {
        geometry = new THREE.IcosahedronGeometry(10, 1);
      };

      replaceSharedGeometry();
      canvas.setConfig({
        threeD: {
          nodeObject: (node, state) => {
            const material = new THREE.MeshStandardMaterial({
              color: node.color,
              transparent: state.opacity < 1,
              opacity: state.opacity,
            });
            return new THREE.Mesh(geometry, material);
          },
          linkDashPattern: (link) => link.relationship === "KNOWS" ? [16, 8] : [],
          linkWidth: 0.8,
          largeGraph: { maxLabeledElements: 1000 },
        },
        isNodeSelected: (node) => node.id === 1,
      });
      canvas.setData({
        nodes: [
          { id: 1, labels: ["Person"], color: "#fb7185", visible: true, data: { name: "Alice" } },
          { id: 2, labels: ["Person"], color: "#60a5fa", visible: true, data: { name: "Bob" } },
          { id: 3, labels: ["Person"], color: "#34d399", visible: true, data: { name: "Carol" } },
        ],
        links: [
          { id: 1, relationship: "KNOWS", color: "#64748b", source: 1, target: 2, visible: true, data: {} },
          { id: 2, relationship: "WORKS_WITH", color: "#a78bfa", source: 2, target: 3, visible: true, data: {} },
        ],
      });

      const linkObject = (link, state) => {
        const material = new THREE.LineBasicMaterial({
          color: link.color,
          transparent: state.opacity < 1,
          opacity: state.opacity,
        });
        return new THREE.Line(new THREE.BufferGeometry(), material);
      };
      const linkObjectPositionUpdate = (object, { start, end }) => {
        object.geometry.setFromPoints([
          new THREE.Vector3(start.x, start.y, start.z),
          new THREE.Vector3(end.x, end.y, end.z),
        ]);
      };

      document.querySelector("#to-3d").addEventListener("click", async () => {
        if (canvas.getDimension() === "2d") replaceSharedGeometry();
        await canvas.setDimension("3d");
        output.textContent = "3D active. Custom node geometry is shared across visuals and released after the last visual lease.";
      });
      document.querySelector("#to-2d").addEventListener("click", async () => {
        await canvas.setDimension("2d");
        output.textContent = "2D active. The 3D visual leases have been released; create fresh Three.js resources before reusing them.";
      });
      document.querySelector("#save-camera").addEventListener("click", () => {
        savedCamera = canvas.threeD.getCameraState();
        output.textContent = JSON.stringify(savedCamera, null, 2);
      });
      document.querySelector("#restore-camera").addEventListener("click", () => {
        if (savedCamera) canvas.threeD.setCameraState(savedCamera);
      });
      document.querySelector("#custom-links").addEventListener("click", () => {
        customLinksEnabled = !customLinksEnabled;
        canvas.setConfig({
          threeD: {
            linkObject: customLinksEnabled ? linkObject : undefined,
            linkObjectPositionUpdate: customLinksEnabled ? linkObjectPositionUpdate : undefined,
          },
        });
        output.textContent = customLinksEnabled
          ? "Custom link objects replace the built-in dashed links while enabled."
          : "Built-in world-unit dash patterns are active.";
      });
      document.querySelector("#culling").addEventListener("click", () => {
        output.textContent = JSON.stringify(canvas.threeD.getCullingStats(), null, 2);
      });

      await customElements.whenDefined("falkordb-canvas");
      output.textContent = "Ready. Switch dimensions and save/restore the 3D camera.";
    </script>
  </body>
</html>
