name: Publish to npm

# One repository, several packages. The release tag picks the package:
#   v<version>                -> @falkordb/ui (the repository root)
#   <dir>-v<version>          -> the package in web-components/<dir>
#                                e.g. canvas-v0.3.0
on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # OIDC trusted publishing requires npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Resolve package and version from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            PKG_PATH="."
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            PKG_PATH="web-components/${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          else
            echo "::error::Tag '$TAG' does not match 'v<version>' or '<web-component-dir>-v<version>'"
            exit 1
          fi
          if [[ ! -f "$PKG_PATH/package.json" ]]; then
            echo "::error::No package.json at $PKG_PATH"
            exit 1
          fi
          echo "path=$PKG_PATH"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $(node -p "require('./$PKG_PATH/package.json').name")@$VERSION from $PKG_PATH"

      # The tag is the source of truth; guard against a stale package.json.
      - name: Set version from Git tag
        working-directory: ${{ steps.pkg.outputs.path }}
        run: npm version "${{ steps.pkg.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        working-directory: ${{ steps.pkg.outputs.path }}
        run: npm run build

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.path }}
        run: npm publish --provenance --access public
