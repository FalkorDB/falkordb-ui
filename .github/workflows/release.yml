name: Publish to npm

on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # OIDC trusted publishing requires npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Resolve version from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Tag '$TAG' does not match 'v<version>'"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      # The tag is the source of truth; guard against a stale package.json.
      - name: Set version from Git tag
        run: npm version "${{ steps.pkg.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
