name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build widget
        run: npm run build

      - name: Verify outputs
        run: |
          test -f dist/falkordb-chat.iife.js || (echo "Missing IIFE bundle" && exit 1)
          test -f dist/falkordb-chat.mjs || (echo "Missing ES module" && exit 1)
          echo "IIFE: $(wc -c < dist/falkordb-chat.iife.js) bytes"
          echo "ESM:  $(wc -c < dist/falkordb-chat.mjs) bytes"

      - name: Upload widget artifact
        uses: actions/upload-artifact@v4
        with:
          name: widget-bundle
          path: dist/
          retention-days: 14
